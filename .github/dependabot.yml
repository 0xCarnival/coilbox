version: 2
updates:
  # The workflow pins actions to commits, so the bumps have to come from somewhere. Weekly is
  # enough: a new action release is not urgent, and a reviewable pull request is better than a
  # mutable tag.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies

  # Runtime and tooling dependencies, grouped so one pull request carries the routine bumps and a
  # major version arrives on its own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript is pinned to the 5.x line on purpose (see docs/pinned-versions.md): the 7.x
      # native port is not supported by the pinned toolchain, and CI proves it by failing. A major
      # here is a migration decision, so it should be made deliberately rather than proposed weekly.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Node types track the pinned Node version (24.x). Jumping to a newer major's types would
      # type-check against an API surface this project does not run on.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
