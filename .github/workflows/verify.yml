name: verify

# The same gates that run on a development machine, so a pull request cannot be merged on a claim
# the repository cannot back up. `pnpm verify` includes the clean-checkout step: it clones the
# committed tree into a temporary directory, installs from the frozen lockfile, and builds there.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The job reads the repository and runs its own gates; it never writes to the repository, so the
# token needs nothing beyond a read.
permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  # Kept in step with docs/pinned-versions.md.
  NODE_VERSION: 24.18.0
  PNPM_VERSION: 11.25.0

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Actions are pinned to a commit, not a tag: a tag can be repointed by whoever owns the
      # action's repository, and a workflow runs that code with this repository's token. Dependabot
      # (.github/dependabot.yml) raises the bumps so the pins do not go stale.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token does not need to survive into later steps.
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Browser checks run headless Chromium with SwiftShader, so a GPU-less runner can still render
      # WebGL2. `--with-deps` installs the shared libraries Chromium needs on Linux.
      - name: Cache the Playwright browser download
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # The browser build is chosen by the pinned @playwright/test version, so that file is the
          # key: a Playwright bump misses the cache and downloads the matching build.
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # The cached download still needs its system libraries on a fresh runner.
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Gates (lint, typecheck, unit tests, stages 0-5)
        run: pnpm verify

      # A failing gate writes evidence and screenshots, and the log for a long run is not readable in
      # the middle afterwards. Keeping the evidence for failures is what makes a red run diagnosable
      # without a second run.
      - name: Upload gate evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-evidence
          path: docs/evidence/
          retention-days: 7
          if-no-files-found: ignore
