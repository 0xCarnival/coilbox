<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coilbox — Stage 0 runtime probe</title>
    <style>
      :root {
        color-scheme: dark;
        --panel: #14171f;
        --line: #262b36;
        --text: #e6e9ef;
        --muted: #8b93a3;
        --accent: #5b9dff;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: #0d0f14;
        color: var(--text);
        font: 13px/1.45 ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }
      h1 { font-size: 13px; margin: 0; font-weight: 600; letter-spacing: 0.02em; }
      .spacer { flex: 1; }
      button {
        background: #1d2230;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 5px 12px;
        font: inherit;
        cursor: pointer;
      }
      button:hover { border-color: var(--accent); }
      button:active { background: #232a3b; }
      main { flex: 1; display: flex; min-height: 0; }
      #probe-canvas { width: 100%; height: 100%; display: block; background: #101319; }
      .viewport { flex: 1; min-width: 0; position: relative; }
      footer {
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 6px 12px;
        background: var(--panel);
        border-top: 1px solid var(--line);
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        flex-wrap: wrap;
      }
      #probe-status { color: var(--text); }
      #probe-error {
        display: none;
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 12px;
        background: #3a1418;
        border: 1px solid #7a2630;
        color: #ffd7db;
        padding: 8px 10px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Stage 0 runtime probe</h1>
      <button id="btn-play" type="button">Play</button>
      <button id="btn-pause" type="button">Pause</button>
      <button id="btn-step" type="button">Step</button>
      <button id="btn-stop" type="button">Stop</button>
      <button id="btn-reset" type="button">Reset</button>
      <span class="spacer"></span>
      <span id="probe-info" style="color: var(--muted)"></span>
    </header>
    <main>
      <div class="viewport">
        <canvas id="probe-canvas"></canvas>
        <div id="probe-error"></div>
      </div>
    </main>
    <footer>
      <span id="probe-status">booting</span>
      <span id="probe-stats"></span>
    </footer>
    <script type="module" src="/src/probe/main.ts"></script>
  </body>
</html>
